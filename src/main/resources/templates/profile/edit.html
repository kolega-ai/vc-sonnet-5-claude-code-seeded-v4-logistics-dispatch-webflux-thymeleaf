<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Profile</title></head>
<body>
<div layout:fragment="content">
    <div class="alert alert-success" th:if="${param.updated}">Profile updated.</div>
    <div class="alert alert-success" th:if="${param.passwordChanged}">Password updated.</div>
    <div class="alert alert-danger" th:if="${param.passwordError}">Current password was incorrect.</div>

    <div class="grid grid-2">
        <div class="card">
            <h2>Your profile</h2>
            <form th:action="@{/profile}" th:object="${form}" method="post">
                <div class="field">
                    <label for="fullName">Full name</label>
                    <input id="fullName" th:field="*{fullName}" required/>
                </div>
                <div class="field">
                    <label for="phone">Phone</label>
                    <input id="phone" th:field="*{phone}"/>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Change password</h2>
            <form th:action="@{/profile/password}" method="post">
                <div class="field">
                    <label for="currentPassword">Current password</label>
                    <input id="currentPassword" name="currentPassword" type="password" required/>
                </div>
                <div class="field">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" name="newPassword" type="password" minlength="8" required/>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update password</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
