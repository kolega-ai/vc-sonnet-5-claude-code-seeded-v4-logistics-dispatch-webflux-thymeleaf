<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Set new password - Field Dispatch Operations</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=${assetVersion})}"/>
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <h1>Set a new password</h1>
        <div class="alert alert-danger" th:if="${param.error}">That link is invalid or has expired. Please request a new one.</div>
        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="field">
                <label for="newPassword">New password</label>
                <input id="newPassword" name="newPassword" type="password" minlength="8" required/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width:100%">Update password</button>
            </div>
        </form>
        <div class="switch-link"><a th:href="@{/login}">Back to sign in</a></div>
    </div>
</div>
</body>
</html>
