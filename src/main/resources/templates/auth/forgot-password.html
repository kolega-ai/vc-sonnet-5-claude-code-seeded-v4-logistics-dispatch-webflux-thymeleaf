<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Reset password - Field Dispatch Operations</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=${assetVersion})}"/>
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <h1>Forgot your password?</h1>
        <p class="subtitle">We'll send a single-use reset link valid for 30 minutes.</p>
        <div class="alert alert-success" th:if="${param.sent}">A reset link has been sent to that address (see the outbox in Admin &gt; ops tools, or application logs in this demo).</div>
        <div class="alert alert-danger" th:if="${param.unknown}">No account exists for that email address.</div>
        <form th:action="@{/forgot-password}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width:100%">Send reset link</button>
            </div>
        </form>
        <div class="switch-link"><a th:href="@{/login}">Back to sign in</a></div>
    </div>
</div>
</body>
</html>
