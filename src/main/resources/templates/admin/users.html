<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Users</title></head>
<body>
<div layout:fragment="content">
    <div class="card">
        <p class="section-title">All users</p>
        <table class="data-table">
            <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.email}"></td>
                <td th:text="${u.fullName}"></td>
                <td><span class="badge badge-primary" th:text="${u.role}"></span></td>
                <td><span class="badge" th:classappend="${u.enabled} ? 'badge-success' : 'badge-danger'" th:text="${u.enabled} ? 'Enabled' : 'Disabled'"></span></td>
                <td style="display:flex; gap:6px; flex-wrap:wrap;">
                    <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" style="display:flex; gap:4px;">
                        <select name="role">
                            <option value="OPS_ADMIN">OPS_ADMIN</option>
                            <option value="DISPATCHER">DISPATCHER</option>
                            <option value="FIELD_WORKER">FIELD_WORKER</option>
                            <option value="CUSTOMER">CUSTOMER</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-outline">Set role</button>
                    </form>
                    <form th:action="@{/admin/users/{id}/enabled(id=${u.id})}" method="post">
                        <input type="hidden" name="enabled" th:value="${!u.enabled}"/>
                        <button type="submit" class="btn btn-sm" th:text="${u.enabled} ? 'Disable' : 'Enable'"></button>
                    </form>
                    <form th:action="@{/admin/dispatchers/{id}/regions(id=${u.id})}" method="post" style="display:flex; gap:4px;">
                        <input name="regionIds" placeholder="1,2" style="width:64px;"/>
                        <button type="submit" class="btn btn-sm btn-outline">Set regions</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
