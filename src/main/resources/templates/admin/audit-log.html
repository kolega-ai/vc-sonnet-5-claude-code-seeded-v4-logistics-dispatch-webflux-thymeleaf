<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Audit Log</title></head>
<body>
<div layout:fragment="content">
    <div class="card">
        <p class="section-title">Audit log (append-only)</p>
        <table class="data-table">
            <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Before</th><th>After</th><th>Basis</th></tr></thead>
            <tbody>
            <tr th:each="e : ${entries}">
                <td th:text="${#temporals.format(e.createdAt, 'MMM d, h:mm:ss a')}"></td>
                <td th:text="${e.actorEmail}"></td>
                <td><span class="badge badge-neutral" th:text="${e.action}"></span></td>
                <td th:text="${e.entityType} + (${e.entityId} != null ? ' #' + ${e.entityId} : '')"></td>
                <td th:text="${e.beforeValue}"></td>
                <td th:text="${e.afterValue}"></td>
                <td th:text="${e.authorizationBasis}"></td>
            </tr>
            </tbody>
        </table>
        <div style="margin-top:14px; display:flex; gap:8px;">
            <a th:if="${page > 0}" th:href="@{/admin/audit-log(page=${page - 1})}" class="btn btn-outline btn-sm">Newer</a>
            <a th:href="@{/admin/audit-log(page=${page + 1})}" class="btn btn-outline btn-sm">Older</a>
        </div>
    </div>
</div>
</body>
</html>
